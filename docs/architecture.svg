    <text x="450" y="156" text-anchor="middle" fill="#9aa194" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">Poetry ù puerto 8000</text>
  </g>

  <path d="M570 140 H630" stroke="#d4a853" stroke-width="2"/>
  <text x="600" y="128" text-anchor="middle" fill="#d4a853" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">classify</text>

  <g font-family="Georgia, 'Times New Roman', serif">
    <rect x="640" y="40" width="300" height="90" rx="18" fill="#10140f" stroke="#6b8f71"/>
    <text x="790" y="78" text-anchor="middle" fill="#efe8d6" font-size="18">TF-IDF local</text>
    <text x="790" y="102" text-anchor="middle" fill="#9aa194" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">scikit-learn ù siempre online</text>

