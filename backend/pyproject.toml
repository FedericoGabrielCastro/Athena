[project]
name = "athena-backend"
version = "0.1.0"
description = "Local AI ticket classifier"
requires-python = ">=3.12,<3.14"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.6",
    "scikit-learn>=1.6",
    "numpy>=2.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
